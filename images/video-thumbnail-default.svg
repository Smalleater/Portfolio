<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="225" fill="url(#bgGradient)"/>
  
  <!-- Film strip pattern -->
  <g opacity="0.1">
    <rect x="20" y="20" width="360" height="185" fill="none" stroke="#fff" stroke-width="2" rx="8"/>
    <line x1="20" y1="60" x2="380" y2="60" stroke="#fff" stroke-width="1"/>
    <line x1="20" y1="165" x2="380" y2="165" stroke="#fff" stroke-width="1"/>
    <circle cx="50" cy="40" r="8" fill="#fff"/>
    <circle cx="90" cy="40" r="8" fill="#fff"/>
    <circle cx="130" cy="40" r="8" fill="#fff"/>
    <circle cx="50" cy="185" r="8" fill="#fff"/>
    <circle cx="90" cy="185" r="8" fill="#fff"/>
    <circle cx="130" cy="185" r="8" fill="#fff"/>
  </g>
  
  <!-- Play button circle -->
  <circle cx="200" cy="112.5" r="50" fill="#e94560" filter="url(#glow)"/>
  <circle cx="200" cy="112.5" r="50" fill="none" stroke="#fff" stroke-width="2" opacity="0.3"/>
  
  <!-- Play triangle -->
  <polygon points="185,92.5 185,132.5 225,112.5" fill="#fff"/>
  
  <!-- Video text -->
  <text x="200" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff" opacity="0.9">VIDEO</text>
</svg>
