<!DOCTYPE html>

    <div class="langSelector">

            <div class="lang-option" data-lang="fr">FR</div>

    <div class="social-link">
        <a href="https://www.linkedin.com/in/adrien-claude/" target="_blank">

                <img src="logos/linkedin_logo.webp">
            </div>
        </a>
        <a href="https://github.com/Smalleater" target="_blank">

                <img src="logos/github_logo.webp">
            </div>
        </a>
    </div>

    <nav class="nav">
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-menu" id="nav-menu">
            <div class="mobile-lang-selector">
                <div class="mobile-lang-toggle">
                    <div class="mobile-lang-option active" data-lang="en">EN</div>
                    <div class="mobile-lang-option" data-lang="fr">FR</div>
                </div>
            </div>
            <a href="index.html" class="nav-item" data-i18n="nav_home"></a>
            <a href="experience.html" class="nav-item" data-i18n="nav_experience"></a>

            <a href="contact.html" class="nav-item" data-i18n="nav_contact"></a>
        </div>
    </nav>

    <main class="main-content">
        <div class="top-navigation">
            <a href="projects.html" class="top-navigation-btn" data-i18n="project_back_to_projects"></a>
            <a href="https://github.com/TimoteeBaboulin/Suna" target="_blank" 
                class="top-navigation-btn" data-i18n="project_goto_github"></a>
        </div>

        <section class="project-header">
            <div class="project-title-container">
                <h1 class="project-title" data-i18n="project_title_suna"></h1>
            </div>
            
            <div class="project-meta">
                <div class="project-status">
                    <span class="status-badge status-completed" data-i18n="project_status_completed"></span>
                </div>
                <div class="project-date" data-i18n="project_date_suna"></div>
                <div class="project-team">
                    <span class="team-icon">👥</span>
                    <span data-i18n="project_team_size_suna"></span>
                </div>
            </div>
        </section>

        <section class="project-gallery">
            <div class="main-image-container">
                <button class="gallery-nav gallery-prev" aria-label="Image précédente">
                    <span>‹</span>
                </button>
                <div class="main-image">
                    <video src="videos/suna/trailer.mp4" class="project-video" controls autoplay muted loop></video>
                </div>
                <button class="gallery-nav gallery-next" aria-label="Image suivante">
                    <span>›</span>
                </button>
            </div>
            <div class="thumbnail-gallery">
                <img src="images/video-thumbnail-default.svg" alt="Video 1" class="thumbnail active" data-media-src="videos/suna/trailer.mp4" data-media-type="video">
                <img src="images/suna/suna_02.webp" alt="Screenshot 1" class="thumbnail">
                <img src="images/suna/suna_03.webp" alt="Screenshot 2" class="thumbnail">
                <img src="images/suna/suna_04.webp" alt="Screenshot 3" class="thumbnail">
                <img src="images/suna/suna_05.webp" alt="Screenshot 4" class="thumbnail">
                <img src="images/suna/suna_06.webp" alt="Screenshot 5" class="thumbnail">
                <img src="images/suna/suna_07.webp" alt="Screenshot 6" class="thumbnail">
                <img src="images/suna/suna_08.webp" alt="Screenshot 7" class="thumbnail">
                <img src="images/suna/suna_09.webp" alt="Screenshot 8" class="thumbnail">
            </div>
        </section>

            <h2 data-i18n="project_overview_title"></h2>
            <div class="description-content">
                <p data-i18n="project_description_suna_1"></p>
                <p data-i18n="project_description_suna_2"></p>
            </div>
        </section>

        <section class="project-role">
            <h2 data-i18n="project_role_title"></h2>
            <div class="role-content">
                <div class="role-header">
                    <div class="role-icon">👨‍💻</div>
                    <div class="role-info">
                        <h3 data-i18n="project_role_position_suna"></h3>
                    </div>
                </div>
                <div class="role-description">
                    <p data-i18n="project_role_description_suna"></p>
                </div>
                <div class="role-responsibilities">
                    <h4 data-i18n="project_role_responsibilities_title"></h4>
                    <ul class="responsibilities-list">
                        <li data-i18n="project_role_responsibility_suna_01"></li>
                        <li data-i18n="project_role_responsibility_suna_02"></li>
                        <li data-i18n="project_role_responsibility_suna_03"></li>
                        <li data-i18n="project_role_responsibility_suna_04"></li>
                        <li data-i18n="project_role_responsibility_suna_05"></li>
                        <li data-i18n="project_role_responsibility_suna_06"></li>
                        <li data-i18n="project_role_responsibility_suna_07"></li>
                        <li data-i18n="project_role_responsibility_suna_08"></li>
                    </ul>
                </div>
            </div>
        </section>

            <h2 data-i18n="project_tech_title"></h2>
            <div class="tech-grid">
                <div class="tech-item tech-no-icon">
                    <span>Unity</span>
                </div>
                <div class="tech-item tech-no-icon">
                    <span>Unity DOTS (ECS)</span>
                </div>
                <div class="tech-item tech-no-icon">
                    <span>Unity Netcode for Entities</span>
                </div>
                <div class="tech-item tech-no-icon">
                    <span>C#</span>
                </div>
                <div class="tech-item tech-no-icon">
                    <span>Visual Studio</span>
                </div>
                <div class="tech-item tech-no-icon">
                    <span>GitHub</span>
                </div>
                <div class="tech-item tech-no-icon">
                    <span>Miro</span>

            <h2 data-i18n="project_features_title"></h2>
            <div class="features-grid">
                <div class="feature-card">
                    <h3 data-i18n="project_feature_title_suna_01"></h3>
                    <p data-i18n="project_feature_desc_suna_01"></p>

                <div class="feature-card">
                    <h3 data-i18n="project_feature_title_suna_02"></h3>

            <h2 data-i18n="project_learnings_title"></h2>
            <div class="learnings-content">
                <p data-i18n="project_learnings_desc_suna"></p>
                <ul class="learnings-list">
                    <li data-i18n="project_learning_suna_01"></li>
                    <li data-i18n="project_learning_suna_02"></li>
                    <li data-i18n="project_learning_suna_03"></li>
                    <li data-i18n="project_learning_suna_04"></li>

    <footer class="footer">
        <p><span class="copyright-symbol">©</span> 2026 <span class="name">Adrien CLAUDE</span>. <span data-i18n="footer_copyright">All rights reserved.</span></p>
